<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#grad)" />

  <!-- Decorative Border -->
  <rect x="15" y="15" width="570" height="370" rx="16" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Icon Circle Background -->
  <circle cx="300" cy="115" r="52" fill="#ffffff" filter="url(#shadow)" opacity="0.95" />
  
  <!-- Icon -->
      <g transform="translate(268, 70) scale(1.6)" fill="#b45309" opacity="0.85">
      <ellipse cx="20" cy="32" rx="12" ry="9" />
      <circle cx="10" cy="18" r="4.5" />
      <circle cx="20" cy="14" r="5" />
      <circle cx="30" cy="18" r="4.5" />
      <circle cx="5" cy="27" r="3.5" />
    </g>

  <!-- Texts -->
  <text x="300" y="210" text-anchor="middle" font-family="'Sarabun', 'Prompt', 'Kanit', sans-serif" font-size="28" font-weight="bold" fill="#1e293b">
    เฟรนช์ บูลด็อก
  </text>

  <text x="300" y="245" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="18" font-weight="600" fill="#b45309">
    French Bulldog
  </text>

  <text x="300" y="275" text-anchor="middle" font-family="'Sarabun', 'Prompt', sans-serif" font-size="14" fill="#64748b">
    Small Breed (สุนัขพันธุ์เล็ก)
  </text>

  <!-- Placeholder Badge / Action note -->
  <g transform="translate(140, 315)">
    <rect width="320" height="38" rx="19" fill="#ffffff" filter="url(#shadow)" opacity="0.95" />
    <text x="160" y="24" text-anchor="middle" font-family="'Sarabun', 'Prompt', sans-serif" font-size="13" font-weight="500" fill="#475569">
      📷 ภาพจำลอง Placeholder (เปลี่ยนเป็นรูปจริงได้)
    </text>
  </g>
</svg>